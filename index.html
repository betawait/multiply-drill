<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Drill</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="layout">
        <h1 class="title">Multiplication Drill</h1>

        <div class="panel">
            <div id="setup-screen">
                <h3 class="section-heading">Select Difficulty</h3>
                <select id="difficulty" class="select">
                    <option value="easy">Easy (practicing 1, 2, 5)</option>
                    <option value="medium">Medium (practicing 3, 6)</option>
                    <option value="hard">Hard (practicing 7, 8, 9)</option>
                </select>
                <button id="start-btn" class="btn btn-primary btn-full">Start Game</button>
            </div>

            <div id="game-screen" class="hidden">
                <div class="status-row">
                    <div>Score: <span id="score">0</span></div>
                    <div>Time: <span id="timer">60</span>s</div>
                </div>
                <div class="progress">
                    <div id="timer-progress" class="progress-bar" role="progressbar" style="width: 100%"></div>
                </div>

                <div class="problem-container">
                    <h2 id="problem">6 × 7 = ?</h2>
                </div>

                <div id="options-container" class="options">
                    <button class="btn btn-option answer-option" type="button"></button>
                    <button class="btn btn-option answer-option" type="button"></button>
                    <button class="btn btn-option answer-option" type="button"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
